<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <linearGradient id="timeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1715"/>
      <stop offset="100%" stop-color="#182c26"/>
    </linearGradient>
  </defs>

  <rect width="960" height="480" fill="url(#timeBg)"/>
  
  <rect x="20" y="20" width="920" height="440" rx="14" fill="#0b1411" stroke="#1f3830" stroke-width="1.5"/>
  <rect x="20" y="20" width="920" height="42" rx="14" fill="#080f0d"/>
  <circle cx="45" cy="41" r="5" fill="#ef4444"/>
  <circle cx="62" cy="41" r="5" fill="#f59e0b"/>
  <circle cx="79" cy="41" r="5" fill="#10b981"/>
  <text x="105" y="45" font-family="sans-serif" font-size="12" font-weight="700" fill="#fcd34d">PARALLEL CHIEFDOM CHRONOLOGY • 1760 TO PRESENT</text>

  <!-- Filter Buttons Row -->
  <g transform="translate(45, 80)">
    <rect width="130" height="32" rx="8" fill="#065f46" stroke="#10b981" stroke-width="1"/>
    <text x="20" y="20" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">👑 All 3 Chiefdoms</text>

    <rect x="145" width="130" height="32" rx="8" fill="#182723" stroke="#2d4a40" stroke-width="1"/>
    <text x="160" y="20" font-family="sans-serif" font-size="11" fill="#a7f3d0">Mong Circle (18)</text>

    <rect x="290" width="130" height="32" rx="8" fill="#182723" stroke="#2d4a40" stroke-width="1"/>
    <text x="305" y="20" font-family="sans-serif" font-size="11" fill="#fde68a">Chakma Circle (24)</text>

    <rect x="435" width="140" height="32" rx="8" fill="#182723" stroke="#2d4a40" stroke-width="1"/>
    <text x="450" y="20" font-family="sans-serif" font-size="11" fill="#fecdd3">Bohmong Circle (16)</text>
  </g>

  <!-- Timeline Backbone Axis -->
  <line x1="120" y1="140" x2="120" y2="430" stroke="#059669" stroke-width="3"/>

  <!-- Milestone 1 -->
  <g transform="translate(120, 160)">
    <circle cx="0" cy="0" r="10" fill="#10b981"/>
    <circle cx="0" cy="0" r="4" fill="#ffffff"/>
    <rect x="30" y="-18" width="720" height="60" rx="8" fill="#12221d" stroke="#10b981" stroke-width="1"/>
    <text x="45" y="5" font-family="sans-serif" font-size="12" font-weight="bold" fill="#34d399">1782 • Chieftain Mrachai Arakanese Migration &amp; Manikchari Court Foundation</text>
    <text x="45" y="25" font-family="sans-serif" font-size="11" fill="#9ca3af">Marma nobility settle the northern Chengi &amp; Feni river valleys following the fall of Mrauk U.</text>
    <rect x="650" y="-10" width="85" height="22" rx="4" fill="#064e3b"/>
    <text x="660" y="5" font-family="monospace" font-size="10" fill="#a7f3d0">Mong Circle</text>
  </g>

  <!-- Milestone 2 -->
  <g transform="translate(120, 245)">
    <circle cx="0" cy="0" r="10" fill="#f59e0b"/>
    <circle cx="0" cy="0" r="4" fill="#ffffff"/>
    <rect x="30" y="-18" width="720" height="60" rx="8" fill="#201c10" stroke="#f59e0b" stroke-width="1"/>
    <text x="45" y="5" font-family="sans-serif" font-size="12" font-weight="bold" fill="#fbbf24">1900 • Codification of CHT Regulation I of 1900 (Rule 34 Non-Alienation)</text>
    <text x="45" y="25" font-family="sans-serif" font-size="11" fill="#9ca3af">British crown formalizes the 3-tier customary administration: Circle Chiefs, Mouza Headmen &amp; Karbaris.</text>
    <rect x="635" y="-10" width="100" height="22" rx="4" fill="#78350f"/>
    <text x="645" y="5" font-family="monospace" font-size="10" fill="#fde68a">Regional CHT</text>
  </g>

  <!-- Milestone 3 -->
  <g transform="translate(120, 330)">
    <circle cx="0" cy="0" r="10" fill="#38bdf8"/>
    <circle cx="0" cy="0" r="4" fill="#ffffff"/>
    <rect x="30" y="-18" width="720" height="60" rx="8" fill="#0f1f28" stroke="#38bdf8" stroke-width="1"/>
    <text x="45" y="5" font-family="sans-serif" font-size="12" font-weight="bold" fill="#7dd3fc">1960 • Inundation of Old Chakma Rajbari &amp; Karnafuli Kaptai Dam Displacement</text>
    <text x="45" y="25" font-family="sans-serif" font-size="11" fill="#9ca3af">54,000 acres of prime arable riverbank submerged; 100,000 indigenous residents uprooted (The Great Bor-Porok).</text>
    <rect x="640" y="-10" width="95" height="22" rx="4" fill="#0c4a6e"/>
    <text x="650" y="5" font-family="monospace" font-size="10" fill="#bae6fd">Chakma Circle</text>
  </g>
</svg>
