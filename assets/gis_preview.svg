<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <linearGradient id="gisBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091310"/>
      <stop offset="100%" stop-color="#12241f"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="960" height="520" fill="url(#gisBg)"/>
  
  <!-- Outer Window Frame -->
  <rect x="20" y="20" width="920" height="480" rx="14" fill="#0d1b17" stroke="#1f3830" stroke-width="1.5" filter="url(#shadow)"/>
  
  <!-- Window Titlebar -->
  <rect x="20" y="20" width="920" height="42" rx="14" fill="#0a1512"/>
  <circle cx="45" cy="41" r="5" fill="#ef4444"/>
  <circle cx="62" cy="41" r="5" fill="#f59e0b"/>
  <circle cx="79" cy="41" r="5" fill="#10b981"/>
  <text x="105" y="45" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#a7f3d0">CHENGMI GIS CARTOGRAPHIC ENGINE • 26 UPAZILAS • 3 ROYAL CHIEFDOMS</text>

  <!-- Left Sidebar (Layer Controls) -->
  <rect x="35" y="75" width="220" height="410" rx="10" fill="#08100e" stroke="#1c332b" stroke-width="1"/>
  <text x="50" y="105" font-family="sans-serif" font-size="12" font-weight="bold" fill="#34d399">🗺️ CARTOGRAPHIC LAYERS</text>

  <!-- District Filter Buttons -->
  <g transform="translate(50, 120)">
    <rect width="85" height="28" rx="6" fill="#065f46" stroke="#10b981" stroke-width="1"/>
    <text x="12" y="18" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">Khagrachari</text>

    <rect x="95" width="85" height="28" rx="6" fill="#182723" stroke="#2d4a40" stroke-width="1"/>
    <text x="110" y="18" font-family="sans-serif" font-size="11" fill="#9ca3af">Rangamati</text>
  </g>

  <!-- Layer Toggles -->
  <g transform="translate(50, 170)">
    <text x="0" y="0" font-family="sans-serif" font-size="10" font-weight="bold" fill="#6ee7b7" letter-spacing="1">LAYER TOGGLES</text>
    
    <!-- Item 1 -->
    <rect x="0" y="12" width="190" height="32" rx="6" fill="#142420"/>
    <circle cx="16" cy="28" r="4" fill="#34d399"/>
    <text x="30" y="32" font-family="sans-serif" font-size="11" fill="#e5e7eb">Upazila Boundaries (26)</text>
    <text x="165" y="32" font-family="sans-serif" font-size="11" fill="#34d399">ON</text>

    <!-- Item 2 -->
    <rect x="0" y="52" width="190" height="32" rx="6" fill="#142420"/>
    <circle cx="16" cy="68" r="4" fill="#38bdf8"/>
    <text x="30" y="72" font-family="sans-serif" font-size="11" fill="#e5e7eb">River Systems (Chengi/Feni)</text>
    <text x="165" y="72" font-family="sans-serif" font-size="11" fill="#38bdf8">ON</text>

    <!-- Item 3 -->
    <rect x="0" y="92" width="190" height="32" rx="6" fill="#142420"/>
    <circle cx="16" cy="108" r="4" fill="#fbbf24"/>
    <text x="30" y="112" font-family="sans-serif" font-size="11" fill="#e5e7eb">3 Royal Circles Overlay</text>
    <text x="165" y="112" font-family="sans-serif" font-size="11" fill="#fbbf24">ON</text>

    <!-- Item 4 -->
    <rect x="0" y="132" width="190" height="32" rx="6" fill="#142420"/>
    <circle cx="16" cy="148" r="4" fill="#f43f5e"/>
    <text x="30" y="152" font-family="sans-serif" font-size="11" fill="#e5e7eb">Oral History Hotspots (9)</text>
    <text x="165" y="152" font-family="sans-serif" font-size="11" fill="#f43f5e">ON</text>

    <!-- Item 5 -->
    <rect x="0" y="172" width="190" height="32" rx="6" fill="#142420"/>
    <circle cx="16" cy="188" r="4" fill="#a78bfa"/>
    <text x="30" y="192" font-family="sans-serif" font-size="11" fill="#e5e7eb">Historic Landmarks (16)</text>
    <text x="165" y="192" font-family="sans-serif" font-size="11" fill="#a78bfa">ON</text>
  </g>

  <!-- Basemap Switcher -->
  <g transform="translate(50, 400)">
    <text x="0" y="0" font-family="sans-serif" font-size="10" font-weight="bold" fill="#6ee7b7" letter-spacing="1">BASE SATELLITE ENGINE</text>
    <rect x="0" y="10" width="190" height="55" rx="6" fill="#182723" stroke="#2d4a40" stroke-width="1"/>
    <text x="12" y="32" font-family="sans-serif" font-size="11" font-weight="bold" fill="#fcd34d">Esri World Imagery + Topo</text>
    <text x="12" y="48" font-family="sans-serif" font-size="10" fill="#9ca3af">Live Global Tile Server • Zoom 6-18</text>
  </g>

  <!-- Main Map Canvas -->
  <rect x="270" y="75" width="655" height="410" rx="10" fill="#040b08" stroke="#1c332b" stroke-width="1"/>

  <!-- Topo Map Curves & Polygons -->
  <path d="M 310 110 L 450 90 L 530 160 L 480 280 L 360 270 Z" fill="#065f46" fill-opacity="0.3" stroke="#10b981" stroke-width="1.5"/>
  <text x="390" y="170" font-family="sans-serif" font-size="12" font-weight="bold" fill="#a7f3d0">MONG CIRCLE</text>
  <text x="385" y="186" font-family="sans-serif" font-size="10" fill="#6ee7b7">Khagrachari Foothills</text>

  <path d="M 480 180 L 660 140 L 780 230 L 710 370 L 520 330 Z" fill="#d97706" fill-opacity="0.25" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="600" y="240" font-family="sans-serif" font-size="12" font-weight="bold" fill="#fde68a">CHAKMA CIRCLE</text>
  <text x="595" y="256" font-family="sans-serif" font-size="10" fill="#fbbf24">Rangamati Lake Basin</text>

  <path d="M 520 330 L 720 370 L 680 470 L 450 460 Z" fill="#e11d48" fill-opacity="0.25" stroke="#f43f5e" stroke-width="1.5"/>
  <text x="540" y="410" font-family="sans-serif" font-size="12" font-weight="bold" fill="#fecdd3">BOHMONG CIRCLE</text>
  <text x="545" y="426" font-family="sans-serif" font-size="10" fill="#fb7185">Bandarban Highland Ridges</text>

  <!-- Flowing Rivers -->
  <path d="M 330 90 Q 420 180, 440 260 T 560 320" fill="none" stroke="#38bdf8" stroke-width="3.5" opacity="0.9"/>
  <path d="M 640 130 Q 610 220, 680 290 T 730 420" fill="none" stroke="#0ea5e9" stroke-width="3" opacity="0.8"/>

  <!-- Hotspot Pins -->
  <g transform="translate(420, 210)">
    <circle cx="0" cy="0" r="14" fill="#f43f5e" opacity="0.3"/>
    <circle cx="0" cy="0" r="6" fill="#f43f5e"/>
    <rect x="12" y="-12" width="130" height="26" rx="6" fill="#1c1917" stroke="#f43f5e" stroke-width="1"/>
    <text x="20" y="4" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff">🎙️ Manikchari Rajbari</text>
  </g>

  <g transform="translate(620, 210)">
    <circle cx="0" cy="0" r="14" fill="#f43f5e" opacity="0.3"/>
    <circle cx="0" cy="0" r="6" fill="#f43f5e"/>
    <rect x="12" y="-12" width="140" height="26" rx="6" fill="#1c1917" stroke="#f43f5e" stroke-width="1"/>
    <text x="20" y="4" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff">🎙️ Kamalchhari Riverbank</text>
  </g>

  <g transform="translate(710, 160)">
    <circle cx="0" cy="0" r="14" fill="#10b981" opacity="0.3"/>
    <circle cx="0" cy="0" r="6" fill="#10b981"/>
    <rect x="12" y="-12" width="120" height="26" rx="6" fill="#1c1917" stroke="#10b981" stroke-width="1"/>
    <text x="20" y="4" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff">⛰️ Sajek Valley (1,800ft)</text>
  </g>

  <!-- Live Bottom Status Bar -->
  <rect x="280" y="445" width="220" height="26" rx="6" fill="#000000" fill-opacity="0.8"/>
  <text x="290" y="462" font-family="monospace" font-size="10" fill="#a7f3d0">23.1079° N, 91.9702° E • Zoom 11</text>
</svg>
