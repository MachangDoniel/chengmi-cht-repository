<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <linearGradient id="audioBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1210"/>
      <stop offset="100%" stop-color="#142620"/>
    </linearGradient>
  </defs>

  <rect width="960" height="480" fill="url(#audioBg)"/>
  
  <rect x="20" y="20" width="920" height="440" rx="14" fill="#0c1714" stroke="#1f3830" stroke-width="1.5"/>
  <rect x="20" y="20" width="920" height="42" rx="14" fill="#08100e"/>
  <circle cx="45" cy="41" r="5" fill="#ef4444"/>
  <circle cx="62" cy="41" r="5" fill="#f59e0b"/>
  <circle cx="79" cy="41" r="5" fill="#10b981"/>
  <text x="105" y="45" font-family="sans-serif" font-size="12" font-weight="700" fill="#f87171">INDIGENOUS ORAL HISTORY AUDIO CONSOLE • REAL WEB AUDIO ACOUSTIC SYNTHESIS</text>

  <!-- Left: Audio Player Controls & Waveform -->
  <g transform="translate(45, 80)">
    <rect width="480" height="360" rx="10" fill="#060e0c" stroke="#1b322a" stroke-width="1"/>
    
    <!-- Track Title -->
    <text x="25" y="35" font-family="serif" font-size="16" font-weight="bold" fill="#ffffff">The Chieftain Mrachai Exodus &amp; Ramgarh Settlement (1782)</text>
    <text x="25" y="55" font-family="serif" font-size="12" font-style="italic" fill="#fcd34d">မြချိုင်း မင်းသမိုင်း နှုတ်ရာဇဝင် • Elder Kra Hla Prue Marma (b. 1912)</text>

    <!-- Waveform Box -->
    <rect x="25" y="75" width="430" height="110" rx="8" fill="#0b1714" stroke="#1e382f" stroke-width="1"/>
    
    <!-- Time Indicator -->
    <text x="35" y="95" font-family="monospace" font-size="11" fill="#34d399">01:16 / 03:04</text>
    <text x="360" y="95" font-family="monospace" font-size="10" fill="#f59e0b">● DIRECT SYNTH</text>

    <!-- Interactive Waveform Bars -->
    <g transform="translate(35, 155)">
      <!-- 25 Bars -->
      <line x1="0" y1="0" x2="0" y2="-20" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
      <line x1="16" y1="0" x2="16" y2="-35" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
      <line x1="32" y1="0" x2="32" y2="-45" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
      <line x1="48" y1="0" x2="48" y2="-25" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
      <line x1="64" y1="0" x2="64" y2="-50" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
      <line x1="80" y1="0" x2="80" y2="-40" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
      <line x1="96" y1="0" x2="96" y2="-30" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
      <line x1="112" y1="0" x2="112" y2="-45" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
      <line x1="128" y1="0" x2="128" y2="-55" stroke="#fcd34d" stroke-width="3" stroke-linecap="round"/>
      <line x1="144" y1="0" x2="144" y2="-38" stroke="#fcd34d" stroke-width="3" stroke-linecap="round"/>
      <line x1="160" y1="0" x2="160" y2="-48" stroke="#fcd34d" stroke-width="3" stroke-linecap="round"/>
      <line x1="176" y1="0" x2="176" y2="-32" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
      <line x1="192" y1="0" x2="192" y2="-42" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
      <line x1="208" y1="0" x2="208" y2="-20" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
      <line x1="224" y1="0" x2="224" y2="-35" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
      <line x1="240" y1="0" x2="240" y2="-45" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
      <line x1="256" y1="0" x2="256" y2="-28" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
      <line x1="272" y1="0" x2="272" y2="-38" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
      <line x1="288" y1="0" x2="288" y2="-15" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
      <line x1="304" y1="0" x2="304" y2="-30" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
      <line x1="320" y1="0" x2="320" y2="-40" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
      <line x1="336" y1="0" x2="336" y2="-22" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
      <line x1="352" y1="0" x2="352" y2="-32" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
      <line x1="368" y1="0" x2="368" y2="-18" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
      <line x1="384" y1="0" x2="384" y2="-26" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
      <line x1="400" y1="0" x2="400" y2="-12" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Play/Pause Controls -->
    <g transform="translate(25, 205)">
      <circle cx="28" cy="28" r="24" fill="#fbbf24"/>
      <polygon points="24,18 24,38 38,28" fill="#18181b"/>
      
      <!-- Skip buttons -->
      <rect x="68" y="14" width="40" height="28" rx="6" fill="#1f2937"/>
      <text x="76" y="32" font-family="sans-serif" font-size="10" fill="#9ca3af">-10s</text>
      
      <rect x="116" y="14" width="40" height="28" rx="6" fill="#1f2937"/>
      <text x="124" y="32" font-family="sans-serif" font-size="10" fill="#9ca3af">+10s</text>

      <!-- Instruments -->
      <text x="180" y="24" font-family="sans-serif" font-size="10" font-weight="bold" fill="#6ee7b7">INSTRUMENTS HEARD:</text>
      <text x="180" y="40" font-family="sans-serif" font-size="10" fill="#9ca3af">Dung (Flute) • Chwe (Gong) • Sari-Pai (Clapper)</text>
    </g>

    <!-- Field Metadata Box -->
    <rect x="25" y="280" width="430" height="60" rx="8" fill="#111c18" stroke="#1f372e" stroke-width="1"/>
    <text x="38" y="302" font-family="monospace" font-size="10" fill="#34d399">CALL NO: TCI-ORAL-74-M01 • RECORDED 1974</text>
    <text x="38" y="322" font-family="sans-serif" font-size="10" fill="#9ca3af">Manikchari Rajbari Court Veranda • Mong Circle Royal Secretariat</text>
  </g>

  <!-- Right: Synchronized Interactive Transcript -->
  <g transform="translate(545, 80)">
    <rect width="370" height="360" rx="10" fill="#08120f" stroke="#1b322a" stroke-width="1"/>
    <text x="20" y="30" font-family="sans-serif" font-size="12" font-weight="bold" fill="#a7f3d0">📜 MULTILINGUAL TRANSCRIPT DOSSIER</text>
    
    <!-- Active Highlight Segment -->
    <rect x="15" y="50" width="340" height="135" rx="8" fill="#142620" stroke="#10b981" stroke-width="1.5"/>
    <text x="25" y="72" font-family="monospace" font-size="10" font-weight="bold" fill="#34d399">[01:16] ACTIVE PHRASE (CLICK TO SEEK)</text>
    <text x="25" y="94" font-family="serif" font-size="11" font-weight="bold" fill="#fde68a">"မာနိက်ဆရီတွင် ပိတောက်ပင်ကြီး စိုက်ထူပြီး နန်းတော်ရာကို သတ်မှတ်သည်။"</text>
    <text x="25" y="120" font-family="serif" font-size="11" fill="#e5e7eb">"Moving south into the fertile valley of Manikchari, Chieftain Mrachai planted the sacred Banyan..."</text>
    <text x="25" y="148" font-family="serif" font-size="10" fill="#9ca3af">"মানিকছড়ির উর্বর উপত্যকায় এসে সর্দার ম্রাচাই পবিত্র বটবৃক্ষ রোপণ করে..."</text>
    <rect x="25" y="160" width="70" height="16" rx="4" fill="#065f46"/>
    <text x="30" y="172" font-family="monospace" font-size="8" fill="#a7f3d0">1782 TREATY</text>

    <!-- Next Inactive Segment -->
    <rect x="15" y="200" width="340" height="120" rx="8" fill="#0d1815" stroke="#1f372e" stroke-width="1"/>
    <text x="25" y="222" font-family="monospace" font-size="10" fill="#6b7280">[02:04] UPCOMING</text>
    <text x="25" y="244" font-family="serif" font-size="11" fill="#9ca3af">"မင်းကြီးတို့၏ တရားစီရင်မှုသည် ဓလေ့ထုံးတမ်းအရ ဖြစ်ပြီး..."</text>
    <text x="25" y="270" font-family="serif" font-size="11" fill="#9ca3af">"The King's justice was governed strictly by customary law..."</text>
    <text x="25" y="295" font-family="serif" font-size="10" fill="#6b7280">"রাজার বিচার প্রথাগত প্রথা অনুসারে পরিচালিত হতো..."</text>
  </g>
</svg>
